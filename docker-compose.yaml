services:
  redis:
    image: redis:6
    ports:
      - "127.0.0.1:6379:6379"

  db:
    image: postgres:13
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: duelyst
      POSTGRES_PASSWORD: duelyst
      POSTGRES_DB: duelyst
    volumes:
      - ./.pgdata:/var/lib/postgresql/data:z

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    working_dir: /duelyst
    ports: [3000:3000]
    volumes:
      - ./dist/src:/duelyst/dist/src:z # Serve frontend via API in localdev.
      - ./serviceAccountKey.json:/duelyst/serviceAccountKey.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /duelyst/serviceAccountKey.json
      FIREBASE_URL: ${FIREBASE_URL}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      TOKEN_SECRET: ${TOKEN_SECRET}
      POSTGRES_CONNECTION: "pg://duelyst:duelyst@db/duelyst"
      REDIS_HOST: redis
    depends_on: [db, redis]

  game:
    build:
      context: .
      dockerfile: docker/game.Dockerfile
    working_dir: /duelyst
    ports: [8001:8001]
    volumes:
      - ./serviceAccountKey.json:/duelyst/serviceAccountKey.json:ro
    environment:
      REDIS_HOST: redis
      GOOGLE_APPLICATION_CREDENTIALS: /duelyst/serviceAccountKey.json
      FIREBASE_URL: ${FIREBASE_URL}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      TOKEN_SECRET: ${TOKEN_SECRET}
    depends_on: [redis]

  sp:
    build:
      context: .
      dockerfile: docker/sp.Dockerfile
    working_dir: /duelyst
    ports: [8000:8000]
    volumes:
      - ./serviceAccountKey.json:/duelyst/serviceAccountKey.json:ro
    environment:
      REDIS_HOST: redis
      GOOGLE_APPLICATION_CREDENTIALS: /duelyst/serviceAccountKey.json
      FIREBASE_URL: ${FIREBASE_URL}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      TOKEN_SECRET: ${TOKEN_SECRET}
    depends_on: [redis]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    working_dir: /duelyst
    volumes:
      - ./serviceAccountKey.json:/duelyst/serviceAccountKey.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /duelyst/serviceAccountKey.json
      FIREBASE_URL: ${FIREBASE_URL}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      POSTGRES_CONNECTION: "pg://duelyst:duelyst@db/duelyst"
      REDIS_HOST: redis
    depends_on: [db, redis]

  worker-ui:
    build:
      context: .
      dockerfile: docker/general.Dockerfile
    working_dir: /duelyst
    environment:
      REDIS_HOST: redis
    profiles: [donotstart]
    ports: [4000:4000]
    entrypoint: ["yarn", "worker-ui"]
    depends_on: [redis]

  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    working_dir: /duelyst
    profiles: [donotstart]
    environment:
      NODE_ENV: development
      POSTGRES_CONNECTION: "pg://duelyst:duelyst@db/duelyst"
    depends_on: [db]

  test-unit:
    build:
      context: .
      dockerfile: docker/general.Dockerfile
    working_dir: /duelyst
    profiles: [donotstart]
    entrypoint: ["yarn", "test:unit"]

  test-integration:
    build:
      context: .
      dockerfile: docker/general.Dockerfile
    working_dir: /duelyst
    profiles: [donotstart]
    environment:
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_URL: ${FIREBASE_URL}
      POSTGRES_CONNECTION: "pg://duelyst:duelyst@db/duelyst"
      REDIS_HOST: redis
    depends_on: [db, redis]
    entrypoint: ["yarn", "test:integration"]

# Host uses a PPPoE link (MTU 1492); Docker's default bridge MTU 1500 makes
# large packets to the Firebase Realtime Database stall, which hangs every
# login/registration (they write to Firebase). Keep the bridge below the path MTU.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
